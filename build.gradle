plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    mods {
        levrn {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }

sourceSets {
    coreTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('coreTest', JavaExec) {
    dependsOn coreTestClasses
    classpath = sourceSets.coreTest.runtimeClasspath
    mainClass = 'dev.levrn.core.CoreTest'
}
tasks.named('check') { dependsOn coreTest }

// Opt-in local client/server integration tests; their classes/resources are excluded from release JARs.
fabricApi.configureTests {
    createSourceSet = true
    modId = 'levrn-localtest'
    enableGameTests = false
    enableClientGameTests = true
}
sourceSets.configureEach {
    if (name == 'gametest') {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

// Ordinary client loop: avoids the upstream client-gametest world's loading barrier.
loom.runs {
    localSmoke {
        client()
        source sourceSets.gametest
        runDir 'build/run/localSmoke'
        vmArg '-Dlevrn.localSmoke=true'
    }
}
